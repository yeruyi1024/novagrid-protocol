openapi: 3.1.0
info:
  title: NovaGrid OpenAI Compatible API
  version: 0.1.0
  description: >-
    NovaGrid v1 对 New API 暴露的公开接口。第一版仅支持模型列表和非流式文本
    Chat Completions；请求正文只存在于受控内存生命周期，不进入持久化协议事件。
  license:
    name: All rights reserved
    identifier: LicenseRef-Proprietary
servers:
  - url: https://novagrid.invalid
    description: 文档占位地址，不能作为真实环境配置
security:
  - bearerAuth: []
paths:
  /v1/models:
    get:
      operationId: listModels
      summary: 列出当前渠道可用的 NovaGrid 品牌模型
      description: 只返回 ACTIVE 且允许当前渠道访问的品牌模型，不暴露内部调度或风控字段。
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
              examples:
                default:
                  value:
                    object: list
                    data:
                      - id: novagrid-chat-7b-v1
                        object: model
                        created: 1786500000
                        owned_by: novagrid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: 创建非流式文本 Chat Completion
      description: >-
        请求使用 120000 毫秒绝对总 deadline，最多产生两个 NovaGrid 节点 Attempt。
        同一 Idempotency-Key 只能确认一个最终成功结果和一份成功用量。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
            examples:
              default:
                value:
                  model: novagrid-chat-7b-v1
                  messages:
                    - role: system
                      content: 你是一名中文写作助手。
                    - role: user
                      content: 请写一个不超过二十字的标题。
                  temperature: 0.7
                  top_p: 0.9
                  max_tokens: 512
                  stop: null
                  stream: false
      responses:
        "200":
          description: 非流式完成结果
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/UnsupportedField"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
        "504":
          $ref: "#/components/responses/DeadlineExceeded"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque channel key
      description: 渠道密钥属于敏感凭据，服务端只保存不可逆摘要。
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 可选请求追踪标识；不得包含客户身份或正文。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选写请求幂等键；相同键配合不同规范化请求时返回 409。
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
  headers:
    RequestId:
      description: NovaGrid 接受或生成的请求追踪标识。
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    Model:
      type: object
      additionalProperties: false
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
          const: novagrid-chat-7b-v1
          description: NovaGrid 品牌模型标识，不冒充其他商业模型。
        object:
          type: string
          const: model
        created:
          type: integer
          format: int64
          minimum: 0
          description: 模型发布的 Unix 秒时间戳。
        owned_by:
          type: string
          const: novagrid
    ModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 65536
          description: UTF-8 文本正文，属于敏感请求数据且不得持久化。
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          type: string
          const: novagrid-chat-7b-v1
        messages:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        top_p:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          default: 1
        max_tokens:
          type: integer
          minimum: 1
          maximum: 4096
        stop:
          oneOf:
            - type: "null"
            - type: string
              minLength: 1
              maxLength: 256
            - type: array
              minItems: 1
              maxItems: 4
              items:
                type: string
                minLength: 1
                maxLength: 256
        stream:
          type: boolean
          const: false
          default: false
          description: 第一版只允许 false；true 返回 422 unsupported_field。
    ChatCompletionResponse:
      type: object
      additionalProperties: false
      required: [id, object, created, model, choices, usage]
      properties:
        id:
          type: string
          pattern: "^chatcmpl_[A-Za-z0-9]+$"
        object:
          type: string
          const: chat.completion
        created:
          type: integer
          format: int64
          minimum: 0
          description: 完成结果创建的 Unix 秒时间戳。
        model:
          type: string
          const: novagrid-chat-7b-v1
        choices:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ChatChoice"
        usage:
          $ref: "#/components/schemas/Usage"
    ChatChoice:
      type: object
      additionalProperties: false
      required: [index, message, finish_reason]
      properties:
        index:
          type: integer
          const: 0
        message:
          type: object
          additionalProperties: false
          required: [role, content]
          properties:
            role:
              type: string
              const: assistant
            content:
              type: string
              maxLength: 262144
              description: UTF-8 文本正文，只在请求内存生命周期中返回。
        finish_reason:
          type: string
          enum: [stop, length]
    Usage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
          description: 必须等于 prompt_tokens 与 completion_tokens 之和。
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [message, type, param, code]
          properties:
            message:
              type: string
              minLength: 1
              maxLength: 512
              description: 面向调用方的安全错误说明，不用于程序判断。
            type:
              type: string
              enum: [invalid_request_error, authentication_error, permission_error, rate_limit_error, server_error]
            param:
              type: [string, "null"]
              maxLength: 128
            code:
              type: string
              enum:
                - invalid_request
                - invalid_api_key
                - model_not_allowed
                - data_policy_rejected
                - idempotency_conflict
                - request_too_large
                - unsupported_field
                - rate_limit_exceeded
                - capacity_unavailable
                - temporarily_unavailable
                - deadline_exceeded
  responses:
    BadRequest:
      description: 请求结构或参数非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 渠道密钥缺失、无效或已撤销
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 模型权限或数据策略拒绝
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: 相同幂等键对应不同规范化请求
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: 请求体、消息或上下文超过限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedField:
      description: 请求包含第一版不支持的字段或行为
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: 渠道或调用方超过限流
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TemporarilyUnavailable:
      description: 无合格节点或暂时服务故障
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DeadlineExceeded:
      description: 120000 毫秒绝对总 deadline 已到期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
